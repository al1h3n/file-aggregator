[package]
name = "file-aggregator"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.29"
eframe = "0.36"
clap = { version = "4.5", features = ["derive"] }
arboard = "3.4"
infer = "0.16"
base64 = "0.23"
rfd = "0.17"
anyhow = "1.0"
image = "0.25"

[build-dependencies]
winres = "0.1"
ico = "0.5"
image = "0.25"

[dev-dependencies]
tempfile = "3.13"

[lib]
name = "file_aggregator"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
